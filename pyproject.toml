[project]
name = "timesfm-forecasting"
version = "0.1.0"
description = "DIMER pipeline for zero-shot time-series forecasting with a pinned Google TimesFM 2.5 checkpoint"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
keywords = ["time-series", "forecasting", "timesfm", "dimer", "zero-shot"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# The core package (data validation, baselines, metrics, provenance) needs only numpy and pandas,
# so CI and the unit suite never install PyTorch. The model stack is the `model` extra; the
# notebook's inline PINS and its hash lock come from tutorials/requirements-colab.in, which pins
# both sets exactly (NOTEBOOK_SPEC 2.2 ENV2). Keep the two files' versions equal.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
]

[project.optional-dependencies]
model = [
    "timesfm==3.0.2",
    "torch==2.14.0",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "nbformat==5.10.4",
    "matplotlib==3.10.8",
]

[project.urls]
Homepage = "https://github.com/kurtvalcorza/timesfm-forecasting-pipeline"
Issues = "https://github.com/kurtvalcorza/timesfm-forecasting-pipeline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timesfm_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the real pinned TimesFM weights, torch and network access on first run",
]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test tables and fixture rows are kept on one line each so a failing case reads as one row.
"tests/*" = ["E501"]
